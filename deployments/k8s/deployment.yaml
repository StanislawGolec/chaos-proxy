apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-chaos-proxy
  labels:
    app.kubernetes.io/name: go-chaos-proxy
    app.kubernetes.io/component: data-plane-proxy
    app.kubernetes.io/part-of: ultimo-ecosystem
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: go-chaos-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-chaos-proxy
        app.kubernetes.io/component: data-plane-proxy
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9091"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: proxy
          image: ghcr.io/stanislawgolec/go-chaos-proxy:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/proxy"]
          args:
            - "--listen=:8090"
            - "--target=$(UPSTREAM_TARGET)"
            - "--grpc=:9090"
            - "--metrics=:9091"
            - "--mode=$(PROXY_MODE)"
            - "--log-level=$(LOG_LEVEL)"
          env:
            - name: UPSTREAM_TARGET
              valueFrom:
                configMapKeyRef:
                  name: go-chaos-proxy-config
                  key: upstream.target
            - name: PROXY_MODE
              valueFrom:
                configMapKeyRef:
                  name: go-chaos-proxy-config
                  key: proxy.mode
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: go-chaos-proxy-config
                  key: log.level
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: data-plane
              containerPort: 8090
              protocol: TCP
            - name: control-plane
              containerPort: 9090
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9091
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2
