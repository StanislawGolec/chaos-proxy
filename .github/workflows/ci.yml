name: CI / Chaos Proxy Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint, Race, Leaks & Fuzz
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Go Vet Analysis
        run: go vet ./...

      - name: Run Unit Tests with Race Detector & Goleak Audit
        run: go test -v -race -timeout 60s ./...

      - name: Run Protocol Fuzz Smoke Tests
        run: go test -v -fuzz=Fuzz -fuzztime=5s ./pkg/protocol

      - name: Run Microbenchmarks & Verify Zero Heap Allocations
        run: go test -v -run=^$ -bench=. -benchmem ./internal/dataplane ./pkg/protocol

      - name: Compile Static Binaries
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -v -ldflags="-s -w" -o bin/proxy ./cmd/proxy
          CGO_ENABLED=0 go build -v -ldflags="-s -w" -o bin/chaosctl ./cmd/chaosctl

  docker-build:
    name: Build Multi-Stage Distroless Image
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployments/Dockerfile
          push: false
          tags: ghcr.io/stanislawgolec/go-chaos-proxy:latest
